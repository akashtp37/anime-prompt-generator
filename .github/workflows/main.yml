name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp anime-prompt-generator/index.html www/
          cp -r anime-prompt-generator/css www/
          cp -r anime-prompt-generator/js www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init AnimePrompt com.akash.animeprompt --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin clash
        run: |
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
              }
          }
          EOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
